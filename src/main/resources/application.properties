spring.application.name=DS_Auth

# Spring Boot does not load .env files automatically.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quistock}
spring.datasource.username=${DB_USERNAME:auth_readonly}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/?replicaSet=rs0}
spring.mongodb.database=${MONGODB_DATABASE:quistock_auth}
spring.data.mongodb.auto-index-creation=false

auth.jwt.issuer=${AUTH_JWT_ISSUER:http://localhost:8090}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:quistock-api}
auth.jwt.private-key-path=${AUTH_JWT_PRIVATE_KEY_PATH:}
auth.jwt.public-key-path=${AUTH_JWT_PUBLIC_KEY_PATH:}
auth.jwt.previous-public-keys=${AUTH_JWT_PREVIOUS_PUBLIC_KEYS:}
auth.jwt.key-id=${AUTH_JWT_KEY_ID:}
auth.jwt.access-token-ttl=5m
auth.jwt.refresh-token-ttl=15d

auth.cookies.secure=${AUTH_COOKIE_SECURE:true}
auth.cookies.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookies.path=${AUTH_COOKIE_PATH:/}
auth.cookies.domain=${AUTH_COOKIE_DOMAIN:}

auth.password.bcrypt-strength=${AUTH_BCRYPT_STRENGTH:12}
auth.rate-limit.hmac-key=${AUTH_RATE_LIMIT_HMAC_KEY:}
auth.rate-limit.login-ip-limit=10
auth.rate-limit.login-ip-window=15m
auth.rate-limit.login-identity-failure-limit=5
auth.rate-limit.login-identity-failure-window=15m
auth.rate-limit.refresh-ip-limit=30
auth.rate-limit.refresh-ip-window=1m
auth.rate-limit.trusted-proxies=${AUTH_TRUSTED_PROXY_CIDRS:}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
